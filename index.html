<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Privacy: the app may only load its own files. No outside server can be contacted. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:; worker-src 'self' blob:; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#faf8fd">
<meta name="color-scheme" content="light only">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Kharcha</title>
<style>
:root{
  --bg:#faf8fd;--card:#ffffff;--ink:#2a2233;--ink2:#7a7186;--line:#ece6f3;
  --accent:#7b4fc0;--accent-soft:#f1eafc;--hero:#f1eafc;--bar:#9b74d6;--track:#f0ebf6;
  --good:#1e8a4c;--bad:#d4483b;--save:#2f7bd0;--send:#c46a12;--peach:#fff1e8;--mint:#e9f7ef;
  --r:18px;--shadow:0 1px 2px rgba(60,30,90,.05),0 6px 18px rgba(60,30,90,.05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif}
button,input,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-size:22px;margin:4px 0 12px}
.top{display:flex;justify-content:space-between;align-items:center}
h2{font-size:18px;margin:0 0 12px;padding-right:40px}
h3{font-size:14px;margin:22px 4px 8px;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between;align-items:center}
h3 button,.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:4px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:var(--hero)}
.lbl{font-size:13px;color:var(--ink2)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.cmp{font-size:13px;margin-bottom:12px;color:var(--ink2)}
.up{color:var(--bad);font-weight:600}.down{color:var(--good);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{background:#fff;border-radius:12px;padding:8px 10px}
.stats small{display:block;color:var(--ink2);font-size:12px}
.stats b{font-variant-numeric:tabular-nums}
.pill{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill b{font-size:18px;font-variant-numeric:tabular-nums}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:16px}
.ibtn{border:0;background:var(--card);width:44px;height:44px;border-radius:50%;box-shadow:var(--shadow);font-size:20px;cursor:pointer;color:var(--accent);flex:none}
.bar-row{margin:12px 0}
.bar-l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-bottom:5px}
.bar-l b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bar-l small{color:var(--ink2);font-weight:400}
.bar-t{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar-f{height:100%;background:var(--bar);border-radius:4px}
.bar-f.over{background:var(--bad)}.bar-f.send{background:var(--send)}.bar-f.save{background:var(--save)}
.warn{color:var(--bad);font-size:12px;margin-top:3px}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.day{padding:10px 16px 4px;font-size:12px;color:var(--ink2);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:none}
.item .mid{flex:1}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}.pos{color:var(--good)}.sav{color:var(--save)}.snd{color:var(--send)}.mov{color:var(--ink2)}
.empty{text-align:center;color:var(--ink2);padding:22px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;font-variant-numeric:tabular-nums}
.kv+.kv{border-top:1px solid var(--line)}
button.kv{width:100%;border:0;background:none;cursor:pointer;text-align:left}
.btn{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:13px 16px;font-weight:600;cursor:pointer;flex:1;min-height:48px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{flex:none;min-height:36px;padding:7px 14px;border-radius:10px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.settle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.settle .who{font-weight:600}
.owe{background:var(--peach)}.ok{background:var(--mint)}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 0}
label input,label select,.inp{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;color:var(--ink)}
label.tog{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin-top:14px;cursor:pointer}
label.tog input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.smart{display:flex;gap:6px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:6px 6px 6px 12px}
.smart input{flex:1;border:0;outline:0;background:none;font-size:16px;padding:8px 0;color:var(--ink)}
.rbtn{width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.rbtn.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.rbtn.on{animation:none}}
.hint{font-size:13px;color:var(--accent);min-height:18px;margin:6px 4px 0}
.amtbox{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--accent);margin:12px 0 4px;padding:4px 2px}
.amtbox span{font-size:30px;font-weight:700;color:var(--ink2)}
.amtbox input{border:0;outline:0;background:none;font-size:36px;font-weight:700;width:100%;padding:0;color:var(--ink);font-variant-numeric:tabular-nums}
.sec{font-size:12px;color:var(--ink2);font-weight:600;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;font-size:14px;min-height:38px;white-space:nowrap}
.chip.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.new{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.chip.new.on{color:#fff}
.dinp{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font-size:14px;min-height:38px}
.seg{display:flex;background:var(--accent-soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 2px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent)}
.note{font-size:13px;color:var(--ink2);line-height:1.5}
.goal .bar-t{height:10px;margin:8px 0 4px}
.goal .bar-f{background:var(--save)}
.hchart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;padding:0;cursor:pointer}
.hbar{width:100%;max-width:26px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.hcol.cur .hbar{background:var(--accent)}
.hv{font-size:10px;color:var(--ink2);margin-bottom:3px;white-space:nowrap}
.hm{font-size:11px;color:var(--ink2);margin-top:5px}
.tripc{width:100%;text-align:left;border:0;cursor:pointer;font:inherit}
.donut{display:flex;gap:14px;align-items:center}
.donut svg{width:132px;height:132px;flex:none}
.legend{flex:1}
.lg{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-variant-numeric:tabular-nums;white-space:nowrap}
.lg.over b{color:var(--bad)}
.ins{display:flex;gap:10px;padding:7px 0;font-size:14px;line-height:1.4}
.ins+.ins{border-top:1px solid var(--line)}
.bill{display:flex;align-items:center;gap:10px;padding:9px 0}
.bill+.bill{border-top:1px solid var(--line)}
.bill .mid{flex:1}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.paid{background:var(--mint);color:var(--good)}.tag.due{background:var(--peach);color:var(--send)}.tag.late{background:#fde8e6;color:var(--bad)}
.qrbox{display:grid;place-items:center;background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line)}
.qrbox svg,.qrbox canvas{width:100%;max-width:320px;height:auto}
video{width:100%;border-radius:16px;background:#000;max-height:50vh;object-fit:cover}
.yr{font-size:28px;font-weight:700;margin:2px 0}
#fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(env(safe-area-inset-bottom) + 78px);height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700;box-shadow:0 8px 20px rgba(123,79,192,.35);cursor:pointer;z-index:5}
#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
#tabs .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--ink2);cursor:pointer}
.tab span{display:block;font-size:20px;margin-bottom:1px}
.tab.on{color:var(--accent);font-weight:700}
#sheet{position:fixed;inset:0;background:rgba(40,20,60,.28);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
#sheetBody{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:94vh;overflow:auto;position:relative}
.x{position:absolute;right:12px;top:12px;border:0;background:var(--accent-soft);color:var(--accent);width:34px;height:34px;border-radius:50%;cursor:pointer}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lock.open{display:flex}
#lock input{font-size:28px;text-align:center;letter-spacing:.5em;width:200px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:92vw;text-align:center;display:flex;gap:14px;align-items:center}
#toast.show{opacity:1}
#toast.show.act{pointer-events:auto}
#toast button{border:0;background:none;color:#d9c4ff;font-weight:700;cursor:pointer;padding:4px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<button id="fab" data-act="add" hidden>+ Add</button>
<nav id="tabs" hidden><div class="in">
  <button class="tab" data-act="tab" data-tab="home"><span>🏠</span>Home</button>
  <button class="tab" data-act="tab" data-tab="history"><span>📊</span>History</button>
  <button class="tab" data-act="tab" data-tab="trips"><span>🧳</span>Trips</button>
  <button class="tab" data-act="tab" data-tab="more"><span>⚙️</span>More</button>
</div></nav>
<div id="sheet"><div id="sheetBody"></div></div>
<div id="lock">
  <div style="font-size:44px">🔒</div>
  <h2 style="margin:10px 0 16px;padding:0">Kharcha is locked</h2>
  <button class="btn" id="bioBtn" style="flex:none;width:240px;margin-bottom:14px" data-act="bioUnlock" hidden>Unlock with Face ID / fingerprint</button>
  <input id="lockIn" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="PIN" aria-label="PIN">
  <button class="btn ghost" style="flex:none;width:200px;margin-top:14px" data-act="unlock">Unlock with PIN</button>
</div>
<div id="toast" role="status"></div>
<input id="fileIn" type="file" hidden>
<input id="imgIn" type="file" accept="image/*" hidden>

<script>
'use strict';
{
/* =========================================================
   DATA — stored only in this phone's storage (localStorage)
   ========================================================= */
const LS='kharcha.v1';
const BASE={rent:['Rent','🏠'],food:['Food','🍛'],zomato:['Zomato / Swiggy','🛵'],shopping:['Shopping','🛍️'],ott:['OTT','📺'],
  office_travel:['Office travel','🚌'],office_food:['Office food','🥪'],petrol:['Petrol','⛽'],bills:['Bills & recharge','🧾'],emi:['EMI / loan','🏦'],
  health:['Health','💊'],travel:['Trip travel','✈️'],stay:['Stay','🏨'],fun:['Fun & outings','🎉'],other:['Other','📦']};
const SAVE={rd:['RD','🏦'],fd:['FD','🔒'],sip:['SIP','📈']};
const INC={salary:['Salary','💼'],other_in:['Other income','💰']};
const LEGACY={aside:['Kept aside','🐷']};
const TCATS={date:['Date','❤️'],food:['Food','🍕'],movie:['Movie','🎬'],travel:['Trip','✈️'],stay:['Stay','🏨'],gift:['Gift','🎁'],shopping:['Shopping','🛍️'],other:['Other','📦']};
const TYPES=[['expense','Spent'],['sent','Sent'],['saving','Saved'],['income','Got'],['move','Move']];
const TYPE_LBL={expense:'Spent',sent:'Sent',saving:'Saved',income:'Received',move:'Moved'};
const KIND_ICON={bank:'🏦',cash:'💵',card:'💳'};
const PAL=['#257de0','#f47230','#00b894','#f2a600','#ee7fac','#6a4ce2'];const GREY='#b9b3c2';

function blank(){return{v:4,setup:false,me:'Amruta',partner:'Tathya',
  accounts:[{id:'a1',name:'Bank 1',opening:0,kind:'bank'},{id:'a2',name:'Bank 2',opening:0,kind:'bank'},{id:'a3',name:'Bank 3',opening:0,kind:'bank'},{id:'cash',name:'Cash',opening:0,kind:'cash'}],
  tx:[],shared:[],goals:[],trips:[],cats:[],learn:{},recipients:['Appa'],budgets:{},sendLimit:0,dateBudget:0,recurring:[],bills:[],
  lastAcc:'a1',pin:null,bio:null,pass:'',lastBackup:0,setupAt:0};}
let S;
try{S=JSON.parse(localStorage.getItem(LS))||blank()}catch(e){S=blank()}
function migrate(){S={...blank(),...S};
  S.accounts.forEach(a=>{if(!a.kind)a.kind='bank'});
  if(!S.accounts.some(a=>a.kind==='cash'))S.accounts.push({id:'cash',name:'Cash',opening:0,kind:'cash'});
  if(S.setup&&!S.setupAt)S.setupAt=Date.now()}
migrate();
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const nf=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2,minimumFractionDigits:0});
const money=n=>nf.format(Math.round((+n||0)*100)/100);
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';return s+(a>=100000?'₹'+(a/100000).toFixed(1).replace(/\.0$/,'')+'L':a>=1000?'₹'+(a/1000).toFixed(1).replace(/\.0$/,'')+'k':'₹'+Math.round(a))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const curMonth=()=>todayStr().slice(0,7);
const yestStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const mdate=m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1);
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const monthLabel=m=>mdate(m).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const monthShort=m=>mdate(m).toLocaleDateString('en-IN',{month:'long'});
const monthAbbr=m=>mdate(m).toLocaleDateString('en-IN',{month:'short'});
const dayLabel=d=>d===todayStr()?'Today':d===yestStr()?'Yesterday':new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const dShort=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:d.slice(0,4)===todayStr().slice(0,4)?undefined:'numeric'}):'';
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
function shiftMonth(m,k){const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
const accOf=id=>S.accounts.find(a=>a.id===id);
const accName=id=>(accOf(id)||{}).name||'—';
const parseAmt=v=>{const n=parseFloat(String(v).replace(/[,₹\s]/g,''));return isFinite(n)?Math.round(n*100)/100:0};
const title=s=>String(s).replace(/\b\w/g,c=>c.toUpperCase());
let toastT,undoFn=null;
function toast(m,undo){const t=$('#toast');undoFn=undo||null;t.innerHTML=esc(m)+(undo?'<button data-act="undo">Undo</button>':'');t.classList.add('show');t.classList.toggle('act',!!undo);clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('show','act');undoFn=null},undo?6000:2600)}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)})}
const absUrl=p=>new URL(p,location.href).href;

/* ---------- categories ---------- */
const customMap=()=>Object.fromEntries(S.cats.map(c=>[c.id,[c.name,c.icon]]));
const expCats=()=>({...BASE,...customMap()});
const allCats=()=>({...BASE,...customMap(),...SAVE,...INC,...LEGACY});
function catInfo(t){if(t.type==='sent')return['Sent to '+(t.to||'someone'),'💸'];if(t.type==='move')return['Moved to '+accName(t.toAcc),'🔁'];return allCats()[t.cat]||['Other','📦']}
const ICON_GUESS={gym:'🏋️',fitness:'🏋️',yoga:'🧘',pet:'🐾',dog:'🐾',cat:'🐾',book:'📚',books:'📚',course:'🎓',class:'🎓',fees:'🎓',tuition:'🎓',gift:'🎁',salon:'💇',parlour:'💇',parlor:'💇',haircut:'💇',
  temple:'🛕',donation:'🙏',insurance:'🛡️',laundry:'🧺',maid:'🧹',cook:'🧑‍🍳',phone:'📱',mobile:'📱',laptop:'💻',bike:'🏍️',car:'🚗',service:'🔧',repair:'🔧',party:'🥳',kids:'🧸',baby:'🍼',beauty:'💄',cosmetics:'💄',electronics:'🔌',furniture:'🛋️',plants:'🪴'};

/* =========================================================
   SMART INPUT — text, voice, photo, bank SMS
   ========================================================= */
const KW=[

const hasCrypto=!!(window.crypto&&crypto.subtle);
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(pass,salt),new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({app:'kharcha',enc:1,salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))})}
async function decrypt(w,pass){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},await keyFrom(pass,unb64(w.salt)),unb64(w.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function sha(s){return b64(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))))}
async function shareFile(name,data,type){const file=new File([data],name,{type:type||'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}

function needPass(){if(!hasCrypto){toast('Open the https link to use encryption');return false}
  if(!S.pass){toast('Set a passcode first (More → Security)');closeSheet();tab='more';searchOn=false;render();return false}return true}
function mergeList(local,incoming){let n=0;const map=new Map(local.map(e=>[e.id,e]));
  (incoming||[]).forEach(e=>{if(!e||!e.id)return;const cur=map.get(e.id);if(!cur||(e.upd||0)>(cur.upd||0)){map.set(e.id,e);n++}});
  return[[...map.values()],n]}
const syncPayload=()=>({kind:'together',from:S.me,to:S.partner,at:Date.now(),shared:S.shared,goals:S.goals,trips:S.trips});
async function handleWrapped(w){
  if(!w||w.app!=='kharcha'){toast('Not a Kharcha file');return}
  let data=w;
  if(w.enc){if(!hasCrypto){toast('Open the https link to use encryption');return}
    try{data=await decrypt(w,S.pass||'')}catch(e){const pass=prompt('Passcode for this data');if(!pass)return;
      try{data=await decrypt(w,pass)}catch(e2){toast('Wrong passcode');return}}}
  if(data.kind==='together'){
    if(data.from===S.me&&!confirm('This came from your own phone. Merge anyway?'))return;
    if(data.from!==S.partner&&data.from!==S.me&&!confirm(`Data is from "${data.from}", but your partner here is "${S.partner}". Names must match on both phones. Merge anyway?`))return;
    let n=0;['shared','goals','trips'].forEach(k=>{const[l,c]=mergeList(S[k],data[k]);S[k]=l;n+=c});
    save();closeSheet();privOpen=true;tab='private';searchOn=false;render();toast(n?`Synced ${n} update${n>1?'s':''} ✓`:'Already up to date ✓')}
  else if(data.kind==='backup'&&data.state){if(!confirm('Restore this backup? It replaces everything on this phone.'))return;
    S=data.state;migrate();save();render();toast('Backup restored ✓')}
  else toast('Unknown data')}
async function handleFile(file){let w;try{w=JSON.parse(await file.text())}catch(e){toast('Not a Kharcha file');return}return handleWrapped(w)}

/* QR sync (#11): encrypted, compressed, shown as a short animated series of QR codes */
let qrTimer=null,qrStream=null,qrRaf=null;
function qrStop(){clearInterval(qrTimer);qrTimer=null;if(qrRaf)cancelAnimationFrame(qrRaf);qrRaf=null;if(qrStream){qrStream.getTracks().forEach(t=>t.stop());qrStream=null}}
async function gz(str,dir){if(!window.CompressionStream)return null;const cs=dir?new CompressionStream('gzip'):new DecompressionStream('gzip');
  const out=new Response(new Blob([str]).stream().pipeThrough(cs));return dir?new Uint8Array(await out.arrayBuffer()):await out.text()}
async function qrShow(){if(!needPass())return;
  openSheet('<h2>Show this on the other phone</h2><div class="note">Preparing…</div>');
  try{await loadScript('lib/qr/qrcode.js')}catch(e){openSheet('<h2>QR sync</h2><p class="note">QR needs the installed app (https link). Use “Send file” instead.</p>');return}
  const enc=await encrypt(syncPayload(),S.pass);const z=await gz(enc,true);const body=z?'z'+b64(z):'p'+btoa(unescape(encodeURIComponent(enc)));
  const size=400,n=Math.ceil(body.length/size),id=Math.random().toString(36).slice(2,6);
  const frames=Array.from({length:n},(_,i)=>`KQ|${id}|${i}|${n}|${body.slice(i*size,(i+1)*size)}`);
  if(n>90){openSheet('<h2>Too much data for QR</h2><p class="note">Your shared history is large. Use “Send file” on WhatsApp instead.</p>');return}
  openSheet(`<h2>Show this on the other phone</h2><p class="note">On the other phone: 🌹 → <b>Scan QR</b>. Keep this screen steady${n>1?` — ${n} codes cycle automatically`:''}.</p><div class="qrbox" id="qrImg"></div><div class="hint" id="qrInfo" style="text-align:center"></div>`);
  let i=0;const draw=()=>{const q=qrcode(0,'L');q.addData(frames[i]);q.make();$('#qrImg').innerHTML=q.createSvgTag({cellSize:4,margin:4,scalable:true});$('#qrInfo').textContent=n>1?`Code ${i+1} of ${n}`:'';i=(i+1)%n};
  draw();if(n>1)qrTimer=setInterval(()=>{if(!$('#qrImg'))return qrStop();draw()},450)}
async function qrScan(){
  openSheet(`<h2>Scan the other phone's QR</h2><video id="qrVid" playsinline muted></video><div class="hint" id="qrInfo" style="text-align:center">Starting camera…</div>`);
  try{await loadScript('lib/qr/jsQR.js');qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}
  catch(e){$('#qrInfo').textContent='Camera not available. Allow camera access, or use “Receive file”.';return}
  const v=$('#qrVid');v.srcObject=qrStream;await v.play().catch(()=>{});
  const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});const parts={};let total=0,sid=null,last=0;
  const tick=async t=>{if(!qrStream)return;qrRaf=requestAnimationFrame(tick);if(t-last<120||v.readyState<2)return;last=t;
    const k=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*k|0;c.height=v.videoHeight*k|0;if(!c.width)return;ctx.drawImage(v,0,0,c.width,c.height);
    const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
    if(!r||!r.data.startsWith('KQ|'))return;const [,id,i,n,...rest]=r.data.split('|');if(sid&&id!==sid)return;sid=id;total=+n;parts[i]=rest.join('|');
    const got=Object.keys(parts).length;$('#qrInfo').textContent=`Got ${got} of ${total}…`;
    if(got===total){qrStop();const body=Array.from({length:total},(_,j)=>parts[j]).join('');let txt;
      try{txt=body[0]==='z'?await gz(unb64(body.slice(1)),false):decodeURIComponent(escape(atob(body.slice(1))))}catch(e){$('#qrInfo').textContent='Could not read — try again';return}
      handleWrapped(JSON.parse(txt))}};
  qrRaf=requestAnimationFrame(tick)}

/* ---------- year in review (#12) ---------- */
function yearReview(){const y=String(yrView);const ms=allMonths().filter(m=>m.startsWith(y));
  const sh=live().filter(e=>isSpend(e)&&e.date.startsWith(y));const tot=sum(sh,e=>e.amt);
  const byCat={};sh.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amt);const topCat=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  const notes={};sh.forEach(e=>{const n=(e.note||'').trim().toLowerCase();if(n)notes[n]=(notes[n]||0)+1});const fav=Object.entries(notes).sort((a,b)=>b[1]-a[1])[0];
  const biggest=[...sh].sort((a,b)=>b.amt-a.amt)[0];
  const byM={};sh.forEach(e=>{const m=e.date.slice(0,7);byM[m]=(byM[m]||0)+1});const busy=Object.entries(byM).sort((a,b)=>b[1]-a[1])[0];
  const meP=sum(sh.filter(mine),e=>e.amt);
  const trips=liveTrips().filter(t=>(t.start||'').startsWith(y)||tripItems(t.id).sh.some(e=>e.date.startsWith(y)));
  const goalsDone=liveGoals().filter(g=>goalSaved(g)>=g.target);
  const P=ms.map(m=>({m,...monthStats(m)}));const pSpent=sum(P,x=>x.spent),pSaved=sum(P,x=>x.saved),pSent=sum(P,x=>x.sent),pGot=sum(P,x=>x.got);
  const cheap=P.filter(x=>x.spent>0).sort((a,b)=>a.spent-b.spent)[0];
  const allCat={};S.tx.filter(t=>t.type==='expense'&&t.date.startsWith(y)).forEach(t=>allCat[t.cat]=(allCat[t.cat]||0)+t.amt);const myTop=Object.entries(allCat).sort((a,b)=>b[1]-a[1])[0];
  const card=(e,l,v)=>`<div class="card" style="background:var(--bg);box-shadow:none;margin-bottom:8px"><div class="lbl">${e} ${l}</div><div class="yr">${v}</div></div>`;
  openSheet(`<div class="mnav" style="margin-right:42px"><button class="ibtn" data-act="yr" data-v="-1" aria-label="Previous year">‹</button><b>✨ ${y} in review</b><button class="ibtn" data-act="yr" data-v="1" aria-label="Next year">›</button></div>
  <h3 style="margin-top:4px">🌹 Us</h3>
  ${sh.length?`${card('🌹','Spent',money(tot))}${card('🎉','Outings',sh.length+(busy?` <small class="lbl">· busiest: ${monthShort(busy[0])} (${busy[1]})</small>`:''))}
  ${topCat?card(TCATS[topCat[0]]?.[1]||'📦','Most on',esc((TCATS[topCat[0]]||['Other'])[0])+` <small class="lbl">${money(topCat[1])}</small>`):''}
  ${fav&&fav[1]>1?card('📍','Favourite',esc(title(fav[0]))+` <small class="lbl">${fav[1]} times</small>`):''}
  ${biggest?card('💎','Biggest treat',money(biggest.amt)+` <small class="lbl">${esc(biggest.note||'')} · ${dShort(biggest.date)}</small>`):''}
  ${card('🤝','Who paid more',(meP>=tot-meP?'Me':'Partner')+` <small class="lbl">${money(meP)} vs ${money(tot-meP)}</small>`)}
  ${trips.length?card('🧳','Trips',trips.map(t=>esc(t.name)).join(', ')):''}${goalsDone.length?card('🎯','Goals reached',goalsDone.map(g=>esc(g.name)).join(', ')):''}`:'<div class="card note">No entries for this year yet.</div>'}
  <h3>Just me</h3>
  ${card('💸','Spent',money(pSpent))}${card('🏦','Saved',money(pSaved))}${card('↗','Sent home',money(pSent))}${card('💼','Received',money(pGot))}
  ${myTop?card(catLabel(myTop[0])[1],'Top category',esc(catLabel(myTop[0])[0])+` <small class="lbl">${money(myTop[1])}</small>`):''}
  ${cheap?card('🌱','Lightest month',monthShort(cheap.m)+` <small class="lbl">${money(cheap.spent)}</small>`):''}`)}

  if(e.target.id==='fDate'&&F){F.date=e.target.value;e.target.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',(c.dataset.v==='0'&&F.date===todayStr())||(c.dataset.v==='1'&&F.date===yestStr())))}
  if(e.target.id==='sm'){SR.m=e.target.value;searchResults()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pp'){e.preventDefault();ACT.privUnlock();return}if(e.key==='Enter'&&(e.target.id==='fAmt'||e.target.id==='smartIn')){e.preventDefault();
  if(e.target.id==='smartIn'){clearTimeout(smartT);const v=e.target.value;if(v.trim())applyParsed(F.form==='sh'?parseTogether(v):parseSmart(v));e.target.blur();return}
  const b=$('[data-act=saveTx],[data-act=saveShared],[data-act=saveGoalMoney]');b&&b.click()}});
document.addEventListener('paste',e=>{if(e.target.id==='smartIn'){setTimeout(()=>{const v=e.target.value;if(v.trim()){clearTimeout(smartT);applyParsed(F.form==='sh'?parseTogether(v):parseSmart(v))}},0)}});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFile(f)});
$('#imgIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!F)return;
  hint('📷 Reading the photo on your phone… (first time ~10–20 s)');
  try{const text=await readImage(f);if(!F)return;const p=parseReceipt(text);
    if(!p.amt){hint('Couldn’t find an amount — please type it');return}
    $('#smartIn').value=[p.amt?money(p.amt):'',p.note].filter(Boolean).join(' · ');applyParsed(p,'img')}
  catch(err){hint('Photo reading needs the installed app (https link). Type the amount instead.')}});

if(S.setup)runRecurring();
render();showLock();
if(S.bio)setTimeout(()=>{if($('#lock').classList.contains('open'))ACT.bioUnlock()},300);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* test hook */ window.__k={unlock:()=>{privOpen=true},parseSmart,parseReceipt,parseSMS,runRecurring,insights,get S(){return S},set S(v){S=v}};
}
</script>
</body>
